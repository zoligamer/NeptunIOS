name: jupiter
description: Jupiter - Open-source student client (Web)
publish_to: 'none'

version: 2.3.0+10

environment:
  sdk: '>=3.1.4 <4.0.0'

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  linked_scroll_controller: ^0.2.0
  fluttertoast: ^9.1.0
  url_launcher: ^6.3.0
  package_info_plus: ^10.1.0
  flutter_timezone: ^5.0.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  in_app_update: ^4.2.5
  device_info_plus: ^13.1.0
  vibration: ^3.1.8
  flutter_native_splash: ^2.4.7
  http: ^1.6.0
  shared_preferences: ^2.3.5
  connectivity_plus: ^7.1.1
  provider: ^6.1.2
  file_picker: ^12.2.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^8.1.0
  change_app_package_name: ^1.5.0
  dio: ^5.9.2
  open_filex: ^4.7.0
  crypto: ^3.0.3
  flutter_markdown: ^0.7.7+1

flutter:
  fonts:
    - family: Noto Color Emoji
      fonts:
        - asset: assets/noto_color_emoji.ttf
  uses-material-design: true

  assets:
    - assets/universityNameUrlPairs.json
    - assets/jupiter_logo.png
    - assets/neptun_logo.png
